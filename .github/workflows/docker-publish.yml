# Builds the production image, publishes it, and requests a Dokploy deployment.
# Owns build credentials, caching, and the deployment webhook request.
# Does not change Dokploy resources or verify deployment completion.

name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_BUILD_ENV: ${{ secrets.DOCKER_BUILD_ENV }}
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKER_BUILD_ENV DOKPLOY_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before publishing."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_ENV: ${{ secrets.DOCKER_BUILD_ENV }}
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: cipherwill/cipherwill:latest
          secret-envs: next_build_env=DOCKER_BUILD_ENV
          # Re-read build settings even when rerunning the same commit.
          no-cache-filters: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Request Dokploy redeployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          response_code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST --user-agent 'Go-http-client/1.1' \
            --header 'Content-Type: application/json' \
            --data '{"repository":{"repo_name":"cipherwill/cipherwill"},"push_data":{"tag":"latest","pusher":"GitHub Actions"}}' \
            "$DOKPLOY_WEBHOOK_URL")
          if [ "$response_code" != "200" ]; then
            echo "::error::Dokploy rejected the deployment request (HTTP $response_code). Check Auto Deploy, the Docker source, image tag, and webhook URL."
            exit 1
          fi
          echo "Dokploy accepted the deployment request. Check its deployment logs for completion."

