# Builds the production image on GitHub and publishes it to Docker Hub.
# Owns build credentials, caching, and publishing cipherwill/cipherwill:latest.
# Does not redeploy Dokploy or change the resources of its running services.

name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_BUILD_ENV: ${{ secrets.DOCKER_BUILD_ENV }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKER_BUILD_ENV; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before publishing."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_ENV: ${{ secrets.DOCKER_BUILD_ENV }}
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: cipherwill/cipherwill:latest
          secret-envs: next_build_env=DOCKER_BUILD_ENV
          # Re-read build settings even when rerunning the same commit.
          no-cache-filters: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

